 upd(dt){this.ht-=dt;if(this.ht<=0&&this.ph!=1)this.hl=-1;if(this.ph==0){this.t+=dt;const k=Math.floor(this.t/.8)-1;if(k>=0&&k<5&&this.t%.8<.5){this.hl=this.s[k];this.ht=.1}if(this.t>5){this.ph=1;this.hl=-1;say(TX.act.turno)}}},

const OBJP=[[640,150],[650,300],[600,100],[660,250],[620,320],[640,120]];
const hint=id=>ALL.find(m=>m.id==id).hi;
function go(cb,dur){if(!S.fd)S.fd={a:0,d:1,dur:dur||.7,cb}}
function enter(){const st=STG[S.i];S.pick=null;if(st.t=='q'){S.scr='q';P={x:W/2-20,y:H/2-20,w:40,h:40};say(TX.pregunta.ayuda)}else{S.scr='over';S.mi=STG.slice(0,S.i).filter(x=>x.t=='mg').length;P={x:20,y:H/2-20,w:40,h:40};S.sx=P.x;say(TX.mapa[S.mi])}}
function next(){S.i++;if(S.i>=STG.length){S.scr='end';say(TX.finalGuia)}else enter()}
function reset(){S={scr:'over',i:0,inv:[],ch:[],t:0,ta:0,moved:0,fd:{a:1,d:-1,dur:1.4}};M=null;enter();drawInv()}
function startMG(id){S.scr='mg';M=Object.assign({id,res:0,rt:0},MG[id]);M.init();say(hint(id))}

function update(dt){S.t+=dt;S.ta=clamp(S.ta+(S.i==0&&!S.moved?1:-1)*dt*.4,0,.8);const f=S.fd;
 if(f){f.a+=f.d*dt/f.dur;if(f.d>0&&f.a>=1){f.a=1;f.d=-1;f.cb()}else if(f.d<0&&f.a<=0)S.fd=null;return}
 if(S.scr=='over'){mv(P,dt,240);if(!S.moved&&Math.abs(P.x-S.sx)+Math.abs(P.y-(H/2-20))>40)S.moved=1;const o=OBJP[S.mi];if(ov(P,{x:o[0],y:o[1],w:60,h:60})){const id=STG[S.i].id;go(()=>startMG(id),.6)}}
 else if(S.scr=='mg'){if(M.exit){mv(P,dt,240);if(P.x+P.w>=W-2)go(next,.8)}else if(M.res){M.rt-=dt;if(M.rt<=0){if(M.res>0){M.exit=1;if(M.id=='act')P={x:W/2-18,y:H/2-18,w:36,h:36};say(TX.salida)}else{M.res=0;M.init();say(hint(M.id))}}}else M.upd&&M.upd(dt)}
 else if(S.scr=='q'&&S.pick==null){mv(P,dt,260);if(P.x<16)choose(0);else if(P.x+P.w>W-16)choose(1)}}

 if(S.scr=='over'){bgi('fondo_mapa','#c9d6c2');const p=OBJP[S.mi],m=ALL.find(x=>x.id==STG[S.i].id);spr('obj_'+m.k,p[0],p[1],60,60,'#f5b700',m.e);spr('personaje',P.x,P.y,P.w,P.h,'#3c4a63','🙂');
  if(S.ta>0){g.save();g.globalAlpha=S.ta;g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=14;g.letterSpacing='3px';g.font='500 62px "Cormorant Garamond",Georgia,serif';g.fillStyle='#f3ead8';g.textAlign='left';g.fillText(TX.titulo,40,92);g.restore()}}
 else if(S.scr=='mg'){const m=ALL.find(x=>x.id==M.id);bgi('bg_'+m.id,m.bg);M.draw();if(M.exit){g.fillStyle='rgba(245,183,0,.7)';g.fillRect(W-16,0,16,H);T('►',W-80,H/2+14,44,'#f5b700');spr('personaje',P.x,P.y,36,36,'#f5b700','🙂')}else if(M.res){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,170,W,100);T(M.res>0?TX.logrado:TX.reintentar,W/2,235,48,M.res>0?'#7fc8a9':'#e4572e','center','800')}}
 else if(S.scr=='q'){bgi('fondo_pregunta','#2b3550');const L=LV[STG[S.i].lv];g.fillStyle='rgba(245,183,0,.7)';g.fillRect(0,0,16,H);g.fillRect(W-16,0,16,H);T(L.q,W/2,70,44,'#f5b700','center','800');[0,1].forEach(i=>{const m=L.m[i],X=i?W-200:50;g.fillStyle=S.pick==i?'rgba(245,183,0,.5)':'rgba(255,255,255,.12)';g.fillRect(X,130,150,190);spr('obj_'+m.k,X+45,145,60,60,'#f5b700',m.e);T(m.nm,X+75,235,18,'#fff','center');wrap(m.t,X+75,262,135,20,15,'#e8edf5','center')});T(TX.pregunta.izq,26,H-14,15,'#fff','left','500');T(TX.pregunta.der,W-26,H-14,15,'#fff','right','500');spr('personaje',P.x,P.y,P.w,P.h,'#f5b700','🙂')}
 else{bgi('final','#1d2433');T(TX.final.titulo,W/2,60,44,'#f5b700','center','800');S.ch.forEach((m,i)=>{T(LV[i].q+'  →  '+m.e+' '+m.nm,60,115+i*34,19,'#fff','left','500')});wrap(TX.final.concl[0]+S.ch.map(m=>m.f).join(', ')+TX.final.concl[1],W/2,250,640,28,22,'#e8edf5','center');if(Math.floor(S.t*2)%2)T(TX.final.rejugar,W/2,400,18,'#fff','center')}
 if(S.fd){g.globalAlpha=clamp(S.fd.a,0,1);g.fillStyle='#10151f';g.fillRect(0,0,W,H);g.globalAlpha=1}}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
